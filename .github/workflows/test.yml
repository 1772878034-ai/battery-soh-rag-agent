name: test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# publish-unit-test-result-action 需要创建 check run / PR 评论
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  unit-tests:
    name: 安装依赖 → Pytest → 上传报告
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 运行 Pytest
        run: |
          mkdir -p reports
          pytest tests/unit -v \
            --html=reports/report.html --self-contained-html \
            --junitxml=reports/junit.xml

      - name: 发布测试结果摘要
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: reports/junit.xml

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: reports/
          retention-days: 14

  e2e-streamlit:
    name: Playwright 测试 Streamlit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 安装 Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: 运行 Playwright E2E
        run: pytest tests/e2e -v

      - name: 上传截图与失败日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-logs
          path: |
            tests/e2e/screenshots/
            tests/e2e/logs/
          retention-days: 14
